name: WB negative watcher
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wb-watcher
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - name: Check negatives
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python negative_watcher.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain alerted.json)" ]; then
            git config user.name "wb-bot"
            git config user.email "actions@users.noreply.github.com"
            git add alerted.json
            git commit -m "update alerted [skip ci]"
            git push
          fi
